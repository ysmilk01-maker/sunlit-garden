<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f2e8">
  <meta name="description" content="거울을 돌려 빛을 잇는 작은 오프라인 퍼즐. 햇빛정원, 12개 스테이지 프로토타입.">
  <title>햇빛정원 — 작은 빛의 퍼즐</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f6f2e8'/%3E%3Cpath d='M32 49V24M32 35C12 35 13 14 13 14C33 14 32 35 32 35ZM32 29C52 29 51 8 51 8C31 8 32 29 32 29Z' fill='%23476d50' stroke='%23476d50' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="햇빛정원 처음으로"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28V13M16 20C3 20 4 6 4 6c13 0 12 14 12 14Zm0-6C29 14 28 1 28 1 15 1 16 14 16 14Z"/></svg><span>SUNLIT<br>GARDEN</span></a>
      <span class="prototype">작은 시제품 · 12개 정원</span>
      <button id="sound" class="icon-button" aria-label="소리 켜기" aria-pressed="false" title="소리 켜기"></button>
    </header>

    <section class="intro" aria-labelledby="title">
      <p class="eyebrow"><span></span> 잠깐의 고요, 한 칸의 초록</p>
      <h1 id="title">햇빛정원<span class="title-spark" aria-hidden="true">✳</span></h1>
      <p class="intro-copy">잎사귀마다, 꼭 맞는 빛을 찾아 주세요.</p>
    </section>

    <section class="game" aria-label="햇빛 퍼즐">
      <div class="chapter-heading">
        <div><p class="chapter-label">WINDOW GARDEN</p><h2 id="level-name"></h2></div>
        <button id="choose-level" class="level-button" aria-haspopup="dialog"><span id="level-number"></span><span class="grid-symbol" aria-hidden="true">▦</span></button>
      </div>
      <div id="board-frame" class="board-frame">
        <svg class="window-light" viewBox="0 0 400 400" aria-hidden="true"><path d="M-45 0H90L370 400H120Z" fill="#fff" opacity=".44"/><path d="M130 0h28l242 335v45Z" fill="#fff" opacity=".25"/></svg>
        <div id="sun-source" class="sun-source" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="7"/><path d="M20 2v6m0 24v6M2 20h6m24 0h6M7 7l4 4m18 18 4 4M7 33l4-4m18-18 4-4"/></svg></div>
        <div class="board-surface">
          <div id="board" class="board" aria-label="4행 4열 퍼즐. 거울 버튼을 누르면 회전합니다."></div>
          <svg id="beam" class="beam" viewBox="0 0 400 400" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="state-row"><span id="plant-count"></span><span id="move-count">0번 회전</span></div>
      <p id="level-note" class="level-note"></p>
      <div class="actions">
        <button id="undo" class="tool-button"><span class="tool-icon" aria-hidden="true">↶</span><span>되돌리기</span></button>
        <button id="restart" class="tool-button"><span class="tool-icon" aria-hidden="true">⟲</span><span>처음부터</span></button>
        <button id="hint" class="tool-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1.3 1-1.5 1.9-1.5 2.5h-5C9.5 15.9 9.3 15 8 14Z"/></svg><span>작은 힌트</span></button>
      </div>
      <div id="success" class="success" hidden>
        <div><span class="success-mark" aria-hidden="true">✓</span><h3 id="success-title">햇살이 닿았어요.</h3><p id="success-copy">오늘의 초록이 조금 더 자랐네요.</p></div>
        <button id="next" class="primary-button">다음 정원 <span aria-hidden="true">↗</span></button>
      </div>
    </section>
    <footer class="footer"><span class="footer-leaf" aria-hidden="true">❧</span><p>시간 제한도, 서두를 이유도 없어요.</p><p id="storage-note">진행 상황은 이 브라우저에만 저장됩니다.</p></footer>
    <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>

  <dialog id="level-dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><div><p class="chapter-label">YOUR LITTLE GARDENS</p><h2 id="dialog-title">어느 창가로 갈까요?</h2></div><button id="close-dialog" class="icon-button" aria-label="스테이지 선택 닫기">×</button></div>
    <p class="dialog-intro">완료한 정원도 언제든 다시 들러 보세요.</p>
    <div id="level-list" class="level-list"></div>
    <p class="dialog-footnote">시제품의 12개 정원을 모두 체험할 수 있어요.<br>10번째 정원부터는 그늘을 좋아하는 식물이 등장해요.</p>
  </dialog>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
